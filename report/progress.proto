
syntax = "proto3";

package progress;

option go_package = "distributed-pow/part2/proto;proto";

// Information about the current progress
message StatusRequest {
    string task_id = 1;
}

message StatusResponse {
    string task_id = 1;
    int32 progress = 2;
    string status = 3;
}

// Request to start watching progress
message WatchRequest {
    string task_id = 1;
}

// One progress update
message ProgressUpdate {
    string task_id = 1;
    int32 progress = 2;
    string message = 3;
}

// gRPC service
service ProgressMonitor {

    // Unary RPC
    rpc GetStatus(StatusRequest) returns (StatusResponse);

    // Server Streaming RPC
    rpc WatchProgress(WatchRequest) returns (stream ProgressUpdate);
}
