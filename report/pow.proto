
syntax = "proto3";

package pow;

option go_package = "distributed-pow/part3/proto;proto";

// Coordinator receives worker registration and heartbeats
service CoordinatorService {
    rpc RegisterWorker(RegisterWorkerRequest)
        returns (RegisterWorkerResponse);

    rpc Heartbeat(HeartbeatRequest)
        returns (HeartbeatResponse);
}

// Workers receive search requests and stream progress/results
service WorkerService {
    rpc Search(SearchRequest)
        returns (stream SearchUpdate);
}

message RegisterWorkerRequest {
    string worker_id = 1;
    string address = 2;
}

message RegisterWorkerResponse {
    bool success = 1;
    string message = 2;
}

message HeartbeatRequest {
    string worker_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}

message SearchRequest {
    string job_id = 1;
    string data = 2;
    int32 difficulty = 3;
    int64 start_nonce = 4;
    int64 end_nonce = 5;
}

message SearchUpdate {
    string worker_id = 1;
    int64 checked_nonces = 2;
    bool found = 3;
    int64 nonce = 4;
    string hash = 5;
    bool completed = 6;
}
